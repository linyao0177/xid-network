[profile.default]
src = "contracts"
out = "out"
test = "test/sol"
libs = ["../boat-registry/sol-lib"]
remappings = ["forge-std/=../boat-registry/sol-lib/forge-std/src/", "boat-registry/=../boat-registry/contracts/"]
allow_paths = ["../boat-registry"]
solc_version = "0.8.28"
offline = true
optimizer = true
optimizer_runs = 200
via_ir = true
