<title>xid network docs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a docs site. A fixed bar on top, the contents on the left (sticky, scrolls on its
   own), the text in a readable column. Same brand as the landing page: cobalt accent,
   Manrope text, Unbounded only for the wordmark and the title. */
:root {
  --bg: #ffffff;
  --side: #f6f7fb;
  --ink: #12152e;
  --mute: #5b5f78;
  --line: #e4e5ee;
  --accent: #2f54ff;
  --accent-soft: rgba(47, 84, 255, 0.08);
  --code-bg: #0f1226;
  --code-ink: #dfe3f5;
  --code-mute: #8b91b4;
  --out-bg: #f3f4f9;
  --display: "Unbounded", "Arial Black", Arial, sans-serif;
  --body: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --bar: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1124; --side: #12162d; --ink: #eceef8; --mute: #a3a8c6; --line: #252a49;
    --accent: #7b93ff; --accent-soft: rgba(123, 147, 255, 0.12);
    --code-bg: #080a18; --out-bg: #161a35; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1124; --side: #12162d; --ink: #eceef8; --mute: #a3a8c6; --line: #252a49;
  --accent: #7b93ff; --accent-soft: rgba(123, 147, 255, 0.12);
  --code-bg: #080a18; --out-bg: #161a35; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar) + 16px); }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--bar);
  background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.04em; text-decoration: none; }
.brand:hover { text-decoration: none; }
.brand i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--accent); position: relative; display: inline-block; }
.brand i::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
.brand span { font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--mute); letter-spacing: 0; }
.bar nav { display: flex; gap: 20px; align-items: center; font-size: 14px; font-weight: 600; }
.bar nav a { color: var(--mute); }
.bar nav a:hover { color: var(--ink); text-decoration: none; }
.menu { display: none; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 14px var(--body); padding: 7px 12px; border-radius: 8px; cursor: pointer; }

.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); }
.side {
  position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar) - env(safe-area-inset-top, 0px));
  overflow-y: auto; background: var(--side); border-right: 1px solid var(--line);
  padding: 24px 14px 40px max(20px, env(safe-area-inset-left, 0px));
}
.side .label { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); margin: 0 10px 10px; }
.side ul { list-style: none; margin: 0; padding: 0; }
.side > ul > li { margin-bottom: 2px; }
.side a { display: block; color: var(--mute); padding: 6px 10px; border-radius: 8px; line-height: 1.35; }
.side a:hover { color: var(--ink); background: var(--accent-soft); text-decoration: none; }
.side a.l2 { color: var(--ink); font-weight: 700; font-size: 15px; margin-top: 6px; }
.side a.l3 { font-size: 14px; padding-left: 22px; }
.side a[aria-current="true"] { color: var(--accent); background: var(--accent-soft); font-weight: 700; }

main { min-width: 0; padding: 48px max(24px, env(safe-area-inset-right, 0px)) 120px 56px; }
.doc { max-width: 780px; }
.doc h1 { font-family: var(--display); font-size: clamp(30px, 4vw, 44px); line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 18px; }
.doc h1 + p { font-size: 19px; color: var(--mute); margin-bottom: 8px; }
.doc h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin: 72px 0 14px; padding-top: 28px; border-top: 1px solid var(--line); }
.doc h3 { font-size: 20px; font-weight: 800; margin: 40px 0 8px; }
.doc h2, .doc h3 { position: relative; text-wrap: balance; }
.anchor { position: absolute; left: -22px; opacity: 0; color: var(--mute); font-weight: 600; }
h2:hover .anchor, h3:hover .anchor { opacity: 1; }
.doc p { margin: 0 0 14px; }
.doc ul, .doc ol { margin: 0 0 16px; padding-left: 24px; }
.doc li { margin-bottom: 6px; }
.doc li > p { margin: 0 0 8px; }
.doc strong { font-weight: 800; }
.doc :not(pre) > code { font-family: var(--mono); font-size: 0.86em; background: var(--out-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; overflow-wrap: anywhere; }

.code { margin: 14px 0 18px; border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--line); }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--code-mute); border-bottom: 1px solid rgba(255,255,255,0.07); }
.code pre { margin: 0; padding: 14px 16px 16px; overflow-x: auto; }
.code code { font-family: var(--mono); font-size: 13.5px; line-height: 1.65; color: var(--code-ink); white-space: pre; }
.code.out { background: var(--out-bg); }
.code.out .code-bar { color: var(--mute); border-bottom-color: var(--line); }
.code.out code { color: var(--ink); }
.copy { font: 700 12px var(--body); color: var(--code-ink); background: rgba(255,255,255,0.08); border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.copy:hover { background: rgba(255,255,255,0.16); }
/* the browser installer's buttons (ESP Web Tools, Download section) */
.install { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 20px; }
.install-btn { font: 700 15px var(--body); color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 10px; padding: 11px 18px; cursor: pointer; }
.install-btn:hover { filter: brightness(1.08); }
.install-btn.line { color: var(--accent); background: transparent; }
.install-btn.line:hover { background: var(--accent-soft); filter: none; }
.install-note { color: var(--mute); font-size: 14px; }

.table { overflow-x: auto; margin: 14px 0 20px; border: 1px solid var(--line); border-radius: 12px; }
.table table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.table th, .table td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.table thead th { background: var(--side); font-weight: 800; font-size: 13px; }
.table thead tr:has(th:empty) { display: none; }
.table tbody tr:last-child td { border-bottom: 0; }
.table td:first-child { font-weight: 700; }

.fig { margin: 18px 0 22px; }
.fig img { display: block; width: 100%; height: auto; background: #ffffff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.fig figcaption { font-size: 13px; color: var(--mute); margin-top: 8px; text-align: center; }

@media (max-width: 960px) {
  .menu { display: inline-block; }
  .bar nav a.opt { display: none; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 25; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); left: 0; width: min(320px, 86vw); transform: translateX(-102%); transition: transform .25s ease; box-shadow: 0 10px 40px rgba(0,0,0,0.18); }
  .side.open { transform: none; }
  main { padding: 28px max(18px, env(safe-area-inset-right, 0px)) 100px max(18px, env(safe-area-inset-left, 0px)); }
  .anchor { display: none; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } html { scroll-behavior: auto; } }
</style>

<header class="bar">
  <div style="display:flex;align-items:center;gap:12px">
    <button type="button" class="menu" id="menu" aria-controls="side" aria-expanded="false">Contents</button>
    <a class="brand" href="#xid-network-docs"><i></i>xid <span>docs</span></a>
  </div>
  <nav aria-label="Site">
    <a class="opt" href="https://claude.ai/artifact/4rr2BAA3RL1dSj6jmCTdxn" target="_blank" rel="noopener">Overview</a>
    <a class="opt" href="https://claude.ai/artifact/N1NXx49MrVeJV8tiAe46WB" target="_blank" rel="noopener">Thesis</a>
    <a class="opt" href="#quick-start">Quick Start</a>
    <a href="https://github.com/linyao0177/xid-network" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<div class="layout">
  <aside class="side" id="side" aria-label="Contents">
    <div class="label">Contents</div>
    <ul><!--NAV--></ul>
  </aside>
  <main>
    <article class="doc"><!--BODY--></article>
  </main>
</div>

<script>
(() => {
  // copy buttons
  document.querySelectorAll('.code .copy').forEach((b) => {
    b.addEventListener('click', async () => {
      const text = b.closest('.code').querySelector('code').innerText
      try { await navigator.clipboard.writeText(text); b.textContent = 'Copied' }
      catch { const r = document.createRange(); r.selectNodeContents(b.closest('.code').querySelector('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected' }
      setTimeout(() => { b.textContent = 'Copy' }, 1500)
    })
  })

  // the sidebar: highlight where the reader is
  const links = [...document.querySelectorAll('.side a')]
  const byId = new Map(links.map((a) => [a.getAttribute('href').slice(1), a]))
  const heads = [...document.querySelectorAll('.doc h2[id], .doc h3[id]')]
  const side = document.getElementById('side')
  const mark = (id) => {
    links.forEach((a) => a.removeAttribute('aria-current'))
    const a = byId.get(id)
    if (!a) return
    a.setAttribute('aria-current', 'true')
    const r = a.getBoundingClientRect(), s = side.getBoundingClientRect()
    if (r.top < s.top + 40 || r.bottom > s.bottom - 40) side.scrollTop += r.top - s.top - s.height / 3
  }
  let ticking = false
  const onScroll = () => {
    if (ticking) return
    ticking = true
    requestAnimationFrame(() => {
      ticking = false
      const y = 90
      let cur = heads[0]
      for (const h of heads) { if (h.getBoundingClientRect().top - y <= 0) cur = h; else break }
      if (cur) mark(cur.id)
    })
  }
  window.addEventListener('scroll', onScroll, { passive: true })
  onScroll()

  // the sidebar on narrow screens
  const menu = document.getElementById('menu')
  const close = () => { side.classList.remove('open'); menu.setAttribute('aria-expanded', 'false') }
  menu.addEventListener('click', () => { const o = side.classList.toggle('open'); menu.setAttribute('aria-expanded', String(o)) })
  links.forEach((a) => a.addEventListener('click', close))
})()
</script>
